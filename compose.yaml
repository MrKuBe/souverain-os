name: souverainos

# SouverainOS — développement hot-reload.
# Les sources sont montées dans les conteneurs ; les images de production
# autonomes restent construites par les cibles finales des Containerfiles.
# La base n'est jamais exposée hors du réseau interne.

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-souverainos}
      POSTGRES_USER: ${POSTGRES_USER:-souverainos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-database-password}
    volumes:
      - souverainos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - souverainos_net
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-souverainos}:${POSTGRES_PASSWORD:-change-me-database-password}@db:5432/${POSTGRES_DB:-souverainos}
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app:z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - souverainos_net
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      target: dev
    init: true
    restart: unless-stopped
    working_dir: /app
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app:z
      - souverainos_frontend_node_modules:/app/node_modules
      - souverainos_frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - souverainos_net
    security_opt:
      - no-new-privileges:true

volumes:
  souverainos_db:
  souverainos_frontend_node_modules:
  souverainos_frontend_next:

networks:
  souverainos_net:
    driver: bridge
    # Volontairement non `internal` : le backend doit pouvoir joindre
    # l'annuaire LDAP et l'API Mercator. La base n'est jamais publiée.
